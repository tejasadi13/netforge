  <text x="797" y="472" class="small">Generates router, switch,</text>
  <text x="797" y="489" class="small">VLAN, and verification commands</text>

  <text x="797" y="554" class="body" style="font-weight:700;">Security Engine</text>
  <text x="797" y="576" class="small">Evaluates segmentation,</text>
  <text x="797" y="593" class="small">firewall presence, and open links</text>

